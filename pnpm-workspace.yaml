# pnpm 12+ : 빌드 스크립트 실행을 패키지 단위로 허용/차단한다.
allowBuilds:
  # 네이티브 바이너리를 내려받거나 빌드해야 하는 패키지 — 반드시 허용
  sharp: true # 이미지 변환 (gatsby-plugin-sharp)
  lmdb: true # Gatsby 데이터 스토어
  msgpackr-extract: true # lmdb 직렬화 가속
  '@parcel/watcher': true # develop 모드 파일 감시

  # postinstall 이 후원 배너 출력이나 텔레메트리 설정만 하는 패키지 — 차단
  gatsby: false
  gatsby-cli: false
  protobufjs: false
  core-js: false
  core-js-pure: false
  es5-ext: false
  '@firebase/util': false

# pnpm 10 (CI 고정 버전) 호환용 — allowBuilds 의 true 항목과 동일하게 유지할 것
onlyBuiltDependencies:
  - sharp
  - lmdb
  - msgpackr-extract
  - '@parcel/watcher'
